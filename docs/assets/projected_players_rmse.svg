<svg xmlns="http://www.w3.org/2000/svg" width="980" height="470" viewBox="0 0 980 470" role="img" aria-labelledby="title desc">
  <title id="title">2025 Projected Players - Weighted RMSE</title>
  <desc id="desc">Horizontal bar chart of weighted RMSE. Lower is better. XGBoost Hitter Projections is highlighted.</desc>
  <rect width="980" height="470" fill="#ffffff"/>
  <text x="40" y="42" fill="#111827" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">2025 Projected Players - Weighted RMSE</text>
  <text x="40" y="68" fill="#4b5563" font-family="Segoe UI, Arial, sans-serif" font-size="14">397 players projected by Tom&#x27;s model. Lower is better. Tom&#x27;s model is highlighted.</text>

  <g stroke="#e5e7eb" stroke-width="1">
    <line x1="300" y1="92" x2="300" y2="398"/>
    <line x1="440" y1="92" x2="440" y2="398"/>
    <line x1="580" y1="92" x2="580" y2="398"/>
    <line x1="720" y1="92" x2="720" y2="398"/>
    <line x1="860" y1="92" x2="860" y2="398"/>
  </g>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#111827">
    <text x="40" y="119">ZiPS</text>
    <rect x="300" y="102" width="425" height="24" fill="#9ca3af"/>
    <text x="740" y="120">0.030330</text>

    <text x="40" y="159">ATC</text>
    <rect x="300" y="142" width="426" height="24" fill="#9ca3af"/>
    <text x="741" y="160">0.030415</text>

    <text x="40" y="199">Steamer</text>
    <rect x="300" y="182" width="427" height="24" fill="#9ca3af"/>
    <text x="742" y="200">0.030466</text>

    <text x="40" y="239">THE BAT X</text>
    <rect x="300" y="222" width="427" height="24" fill="#9ca3af"/>
    <text x="742" y="240">0.030498</text>

    <text x="40" y="279" font-weight="700">XGBoost Hitter Projections</text>
    <rect x="300" y="262" width="428" height="24" fill="#60a5fa"/>
    <text x="743" y="280" font-weight="700">0.030536</text>

    <text x="40" y="319">OOPSY</text>
    <rect x="300" y="302" width="429" height="24" fill="#9ca3af"/>
    <text x="744" y="320">0.030662</text>

    <text x="40" y="359">Naive</text>
    <rect x="300" y="342" width="529" height="24" fill="#d1d5db"/>
    <text x="844" y="360">0.037767</text>

  </g>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#6b7280">
    <text x="294" y="420" text-anchor="start">0.000</text>
    <text x="434" y="420" text-anchor="start">0.010</text>
    <text x="574" y="420" text-anchor="start">0.020</text>
    <text x="714" y="420" text-anchor="start">0.030</text>
    <text x="854" y="420" text-anchor="start">0.040</text>
  </g>
</svg>
