<svg xmlns="http://www.w3.org/2000/svg" width="980" height="430" viewBox="0 0 980 430" role="img" aria-labelledby="title desc">
  <title id="title">2025 Pairwise Matched-Sample RMSE Comparison</title>
  <desc id="desc">Grouped horizontal bars comparing XGBoost RMSE against each public model on matched player samples.</desc>
  <rect width="980" height="430" fill="#ffffff"/>
  <text x="40" y="42" fill="#111827" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">Pairwise Matched-Sample RMSE</text>
  <text x="40" y="68" fill="#4b5563" font-family="Segoe UI, Arial, sans-serif" font-size="14">Player counts are shown per matchup. Each row uses only shared players.</text>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="13">
    <rect x="690" y="32" width="16" height="16" fill="#60a5fa"/>
    <text x="714" y="45" fill="#111827">XGBoost</text>
    <rect x="790" y="32" width="16" height="16" fill="#9ca3af"/>
    <text x="814" y="45" fill="#111827">Other system</text>
  </g>

  <g stroke="#e5e7eb" stroke-width="1">
    <line x1="300" y1="95" x2="300" y2="358"/>
    <line x1="440" y1="95" x2="440" y2="358"/>
    <line x1="580" y1="95" x2="580" y2="358"/>
    <line x1="720" y1="95" x2="720" y2="358"/>
    <line x1="860" y1="95" x2="860" y2="358"/>
  </g>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#111827">
    <text x="40" y="124">OOPSY</text>
    <rect x="300" y="102" width="427" height="12" fill="#60a5fa"/>
    <rect x="300" y="118" width="429" height="12" fill="#9ca3af"/>
    <text x="744" y="127">392 players</text>

    <text x="40" y="174">THE BAT X</text>
    <rect x="300" y="152" width="428" height="12" fill="#60a5fa"/>
    <rect x="300" y="168" width="427" height="12" fill="#9ca3af"/>
    <text x="744" y="177">393 players</text>

    <text x="40" y="224">Steamer</text>
    <rect x="300" y="202" width="428" height="12" fill="#60a5fa"/>
    <rect x="300" y="218" width="427" height="12" fill="#9ca3af"/>
    <text x="744" y="227">397 players</text>

    <text x="40" y="274">ZiPS</text>
    <rect x="300" y="252" width="428" height="12" fill="#60a5fa"/>
    <rect x="300" y="268" width="425" height="12" fill="#9ca3af"/>
    <text x="744" y="277">397 players</text>

    <text x="40" y="324">ATC</text>
    <rect x="300" y="302" width="428" height="12" fill="#60a5fa"/>
    <rect x="300" y="318" width="426" height="12" fill="#9ca3af"/>
    <text x="744" y="327">392 players</text>

  </g>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#6b7280">
    <text x="294" y="382" text-anchor="start">0.000</text>
    <text x="434" y="382" text-anchor="start">0.010</text>
    <text x="574" y="382" text-anchor="start">0.020</text>
    <text x="714" y="382" text-anchor="start">0.030</text>
    <text x="854" y="382" text-anchor="start">0.040</text>
  </g>
</svg>
