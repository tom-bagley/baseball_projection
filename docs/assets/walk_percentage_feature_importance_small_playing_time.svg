<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560" role="img" aria-labelledby="title desc">
  <title id="title">Small Playing-Time Walk Percentage Model</title>
  <desc id="desc">Horizontal bar chart showing the top ten XGBoost gain importances for the walk percentage model.</desc>
  <rect width="980" height="560" fill="#ffffff"/>
  <text x="40" y="42" fill="#111827" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">Small Playing-Time Walk Percentage Model</text>
  <text x="40" y="68" fill="#4b5563" font-family="Segoe UI, Arial, sans-serif" font-size="14">Hitters with less than 950 prior PA; bars normalize to the top feature, labels show share of top-10 gain.</text>
  <g stroke="#e5e7eb" stroke-width="1">
    <line x1="420" y1="92" x2="420" y2="490"/>
    <line x1="580" y1="92" x2="580" y2="490"/>
    <line x1="740" y1="92" x2="740" y2="490"/>
    <line x1="900" y1="92" x2="900" y2="490"/>
  </g>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#111827">
    <text x="40" y="121">Marcel BB%</text>
    <rect x="260" y="104" width="640" height="22" fill="#60a5fa"/>
    <text x="912" y="121" fill="#374151">31.1%</text>

    <text x="40" y="161">Prev O-Swing%</text>
    <rect x="260" y="144" width="387" height="22" fill="#60a5fa"/>
    <text x="659" y="161" fill="#374151">18.8%</text>

    <text x="40" y="201">Prev TTO%</text>
    <rect x="260" y="184" width="200" height="22" fill="#60a5fa"/>
    <text x="472" y="201" fill="#374151">9.7%</text>

    <text x="40" y="241">Prev BB/K</text>
    <rect x="260" y="224" width="157" height="22" fill="#60a5fa"/>
    <text x="429" y="241" fill="#374151">7.6%</text>

    <text x="40" y="281">Prev Swing%</text>
    <rect x="260" y="264" width="143" height="22" fill="#60a5fa"/>
    <text x="415" y="281" fill="#374151">7.0%</text>

    <text x="40" y="321">Prev LA</text>
    <rect x="260" y="304" width="133" height="22" fill="#60a5fa"/>
    <text x="405" y="321" fill="#374151">6.4%</text>

    <text x="40" y="361">Prev Contact%</text>
    <rect x="260" y="344" width="113" height="22" fill="#60a5fa"/>
    <text x="385" y="361" fill="#374151">5.5%</text>

    <text x="40" y="401">Prev wOBA</text>
    <rect x="260" y="384" width="107" height="22" fill="#60a5fa"/>
    <text x="379" y="401" fill="#374151">5.2%</text>

    <text x="40" y="441">Prev FB%</text>
    <rect x="260" y="424" width="93" height="22" fill="#60a5fa"/>
    <text x="365" y="441" fill="#374151">4.5%</text>

    <text x="40" y="481">Prev F-Strike%</text>
    <rect x="260" y="464" width="86" height="22" fill="#60a5fa"/>
    <text x="358" y="481" fill="#374151">4.2%</text>

  </g>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#6b7280">
    <text x="254" y="516" text-anchor="end">0</text>
    <text x="420" y="516" text-anchor="middle">25%</text>
    <text x="580" y="516" text-anchor="middle">50%</text>
    <text x="740" y="516" text-anchor="middle">75%</text>
    <text x="900" y="516" text-anchor="middle">100%</text>
  </g>
</svg>
